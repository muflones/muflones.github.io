<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="base-path" content="{{BASE}}">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://*.tile.opentopomap.org https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Muflones — tracce del club</title>
<meta name="description" content="Le tracce GPX del Muflones Trail Running Club: mappa, distanza, dislivello e profilo altimetrico.">
<link rel="icon" href="{{BASE}}img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{BASE}}vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="{{BASE}}css/style.css">
<script src="{{BASE}}vendor/leaflet/leaflet.js" defer></script>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Vai al contenuto</a>
<header class="site-header">
  <a class="brand" href="{{BASE}}">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 24 L11 11 L15 17 L19 9 L27 24 Z"/><path d="M19 9 C22 6 25 7 25 11"/></svg>
    <span class="brand-name">Muflones</span>
    <span class="brand-sub" data-i18n="brandSub">Trail Running Club</span>
  </a>
  <nav class="nav" aria-label="Menu">
    <a href="{{BASE}}" aria-current="page" data-i18n="navTracks">Percorsi</a>
  </nav>
  <div class="header-end">
    <div class="lang" role="group" data-i18n-aria="langGroup" aria-label="Lingua / Language">
      <button type="button" lang="it" data-lang="it" aria-pressed="true">IT</button>
      <button type="button" lang="en" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <a class="btn btn-primary" href="{{BASE}}proponi/"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="M6 10l6-6 6 6"/><path d="M4 20h16"/></svg><span class="header-cta-label" data-i18n="submitCta">Proponi una traccia</span></a>
  </div>
</header>
<main id="main" class="home">
  <section class="home-list" aria-labelledby="home-title">
    <div>
      <h1 id="home-title" class="display" data-i18n="homeTitle">Tracce del club</h1>
      <p class="muted" id="home-count" style="font-size:13px;margin-top:4px">&nbsp;</p>
    </div>
    <div class="field">
      <label for="q" class="label-caps" data-i18n="search">Cerca</label>
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#585D55" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" class="input" type="search" autocomplete="off" data-i18n-ph="searchPh" placeholder="Nome, tag o autore">
      </div>
    </div>
    <div class="filters" role="group" data-i18n-aria="filterGroup" aria-label="Filtra per distanza">
      <button type="button" data-filter="all" aria-pressed="true" data-i18n="fAll">Tutte</button>
      <button type="button" data-filter="short" aria-pressed="false" data-i18n="fShort">Sotto 25 km</button>
      <button type="button" data-filter="mid" aria-pressed="false" data-i18n="fMid">25–60 km</button>
      <button type="button" data-filter="ultra" aria-pressed="false" data-i18n="fUltra">Ultra</button>
    </div>
    <ul class="cards" id="cards" aria-live="polite"></ul>
    <a class="drop-cta" href="{{BASE}}proponi/">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#585D55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      <strong data-i18n="dropTitle">Hai un percorso da condividere?</strong>
      <span data-i18n="dropText"></span>
    </a>
    <p class="fineprint" data-i18n="attributionShort"></p>
  </section>

  <section class="home-map" id="home-map" data-i18n-aria="mapLabel" aria-label="Mappa">
    <div id="map"></div>
    <div class="map-panel map-style" role="group" data-i18n-aria="mapStyle" aria-label="Stile mappa">
      <button type="button" data-layer="topo" aria-pressed="true" data-i18n="mapTopo">Topo</button>
      <button type="button" data-layer="streets" aria-pressed="false" data-i18n="mapStreets">Strade</button>
    </div>
    <div class="map-panel map-legend" aria-hidden="true">
      <span><i class="legend-line"></i><span data-i18n="legendSelected"></span></span>
      <span><i class="legend-dot"></i><span data-i18n="legendStarts"></span></span>
      <span><i class="legend-dash"></i><span id="legend-area"></span></span>
    </div>
    <div class="map-panel selected" id="selected" hidden></div>
  </section>
</main>
<script type="module" src="{{BASE}}js/home.js"></script>
</body>
</html>
