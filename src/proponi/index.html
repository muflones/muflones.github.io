<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="base-path" content="{{BASE}}">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://*.tile.opentopomap.org https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Proponi una traccia — Muflones</title>
<meta name="robots" content="noindex">
<link rel="icon" href="{{BASE}}img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{BASE}}vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="{{BASE}}css/style.css">
<script src="{{BASE}}vendor/leaflet/leaflet.js" defer></script>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Vai al contenuto</a>
<header class="site-header">
  <a class="brand" href="{{BASE}}">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 24 L11 11 L15 17 L19 9 L27 24 Z"/><path d="M19 9 C22 6 25 7 25 11"/></svg>
    <span class="brand-name">Muflones</span>
    <span class="brand-sub" data-i18n="brandSub">Trail Running Club</span>
  </a>
  <nav class="nav" aria-label="Menu">
    <a href="{{BASE}}"  data-i18n="navTracks">Percorsi</a>
  </nav>
  <div class="header-end">
    <div class="lang" role="group" data-i18n-aria="langGroup" aria-label="Lingua / Language">
      <button type="button" lang="it" data-lang="it" aria-pressed="true">IT</button>
      <button type="button" lang="en" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <a class="btn btn-dark-ghost" href="{{BASE}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span data-i18n="close">Chiudi</span></a>
  </div>
</header>
<main id="main" class="page">
  <div class="submit-head">
    <h1 class="display" data-i18n="submitTitle">Proponi una traccia</h1>
    <ol class="steps" data-i18n-aria="stepsLabel" aria-label="Passaggi">
      <li id="st1" aria-current="step" data-i18n="step1"></li>
      <li id="st2" data-i18n="step2"></li>
      <li id="st3" data-i18n="step3"></li>
    </ol>
  </div>

  <div class="submit-grid">
    <div class="form" id="left">
      <div id="alert" role="alert"></div>

      <label class="dropzone" id="dropzone" for="file">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#585D55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
        <strong data-i18n="dzTitle">Trascina qui il file .gpx</strong>
        <span class="muted" data-i18n="dzText"></span>
        <span class="btn" aria-hidden="true" data-i18n="dzButton">Scegli un file</span>
      </label>
      <input type="file" id="file" accept=".gpx,application/gpx+xml" class="visually-hidden">

      <div id="details" hidden class="form">
        <div class="file-chip">
          <span class="file-badge">GPX</span>
          <div><strong id="file-name"></strong><span class="mono muted" style="font-size:12px" id="file-info"></span></div>
          <button type="button" class="btn" id="replace" data-i18n="replace">Sostituisci</button>
        </div>

        <section class="box send-box" aria-labelledby="send-h">
          <h2 id="send-h" tabindex="-1" class="display" style="font-size:28px" data-i18n="sendTitle">Invia la traccia</h2>
          <p data-i18n="sendIntro"></p>
          <div id="admin-ok" class="form" style="gap:10px">
            <span class="email-addr mono" id="admin-email"></span>
            <div class="actions">
              <button type="button" class="btn" id="copy-email">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                <span data-i18n="copyEmail">Copia indirizzo</span>
              </button>
              <a class="btn btn-primary" id="mailto" href="#">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
                <span data-i18n="writeEmail">Scrivi l’email</span>
              </a>
            </div>
          </div>
          <p id="admin-missing" class="alert alert-error" hidden data-i18n="adminMissing"></p>
          <div>
            <strong data-i18n="mailIncludeTitle">Nell’email scrivi:</strong>
            <ul class="checklist">
              <li data-i18n="mailInclude1"></li>
              <li data-i18n="mailInclude2"></li>
              <li data-i18n="mailInclude3"></li>
            </ul>
            <p class="attach-reminder" data-i18n="attachReminder"></p>
          </div>
          <div class="clean-box">
            <strong data-i18n="cleanTitle">Consigliato: allega la copia pulita</strong>
            <p class="help" data-i18n="cleanText"></p>
            <button type="button" class="btn" id="clean">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12"/><path d="M6 10l6 6 6-6"/><path d="M4 20h16"/></svg>
              <span data-i18n="cleanButton">Scarica la copia pulita</span>
            </button>
          </div>
          <p class="help"><span data-i18n="ghLine"></span> <a id="gh-link" href="#" target="_blank" rel="noopener">GitHub</a></p>
        </section>
      </div>
    </div>

    <section class="box preview" aria-labelledby="pv-h">
      <div class="box-head"><h2 id="pv-h" class="display" data-i18n="preview">Anteprima</h2><span class="help" data-i18n="previewNote"></span></div>
      <div id="pv-empty" class="preview-empty" data-i18n="previewEmpty"></div>
      <div id="pv" hidden class="form" style="gap:16px">
        <div class="preview-map"><div id="map"></div></div>
        <div class="preview-stats" id="pv-stats"></div>
        <div class="profile" id="pv-profile"></div>
      </div>
    </section>
  </div>
</main>
<footer class="site-footer">
  <div class="cols">
    <section><h2 data-i18n="fAttrTitle">Attribuzione</h2><p data-i18n="fAttr"></p></section>
    <section><h2 data-i18n="fMountainTitle">In montagna</h2><p data-i18n="fMountain"></p></section>
    <section><h2 data-i18n="fMapsTitle">Mappe</h2><p><span data-i18n="fMaps"></span> <a href="mailto:{{ADMIN_EMAIL}}" data-i18n="fError">Scrivici</a></p></section>
  </div>
</footer>
<script type="module" src="{{BASE}}js/submit.js"></script>
</body>
</html>
